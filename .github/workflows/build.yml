name: Build apps
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: QuickDrop-Android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller cryptography "qrcode[pil]" tkinterdnd2
      - name: Build QuickDrop.exe
        working-directory: desktop
        run: pyinstaller --onefile --windowed --collect-all tkinterdnd2 --name QuickDrop quickdrop_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: QuickDrop-Windows-exe
          path: desktop/dist/QuickDrop.exe
